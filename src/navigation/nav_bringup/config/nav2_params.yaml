# Navigation stack only: map + TF come from SLAM / other nodes. No AMCL / map_server.
bt_navigator:
  ros__parameters:
    use_sim_time: True
    global_frame: map
    robot_base_frame: "@@ROBOT@@/base_footprint"
    odom_topic: "/@@ROBOT@@/odom"
    bt_loop_duration: 10
    # Foxy hardcodes a 10 ms BT blackboard timeout and does not read the later
    # default_server_timeout parameter. Our BT XML sets server_timeout on each
    # action/service port to allow goal acknowledgements on a loaded host.
    enable_groot_monitoring: False
    groot_zmq_publisher_port: 1666
    groot_zmq_server_port: 1667
    default_bt_xml_filename: "navigate_w_replanning_and_recovery.xml"
    plugin_lib_names:
    - nav2_compute_path_to_pose_action_bt_node
    - nav2_follow_path_action_bt_node
    - nav2_back_up_action_bt_node
    - nav2_spin_action_bt_node
    - nav2_wait_action_bt_node
    - nav2_clear_costmap_service_bt_node
    - nav2_is_stuck_condition_bt_node
    - nav2_goal_reached_condition_bt_node
    - nav2_goal_updated_condition_bt_node
    - nav2_initial_pose_received_condition_bt_node
    - nav2_reinitialize_global_localization_service_bt_node
    - nav2_rate_controller_bt_node
    - nav2_distance_controller_bt_node
    - nav2_speed_controller_bt_node
    - nav2_truncate_path_action_bt_node
    - nav2_goal_updater_node_bt_node
    - nav2_recovery_node_bt_node
    - nav2_pipeline_sequence_bt_node
    - nav2_round_robin_node_bt_node
    - nav2_transform_available_condition_bt_node
    - nav2_time_expired_condition_bt_node
    - nav2_distance_traveled_condition_bt_node

bt_navigator_rclcpp_node:
  ros__parameters:
    use_sim_time: True

controller_server:
  ros__parameters:
    use_sim_time: True
    # 10 Hz is ample at 0.18 m/s and avoids Foxy action timeouts when the
    # simulator cannot sustain the previous 20 Hz control loop.
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    progress_checker_plugin: "progress_checker"
    goal_checker_plugin: "goal_checker"
    controller_plugins: ["FollowPath"]

    # Progress checker parameters
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      # Count the slow final approach instead of requiring another 20 cm
      # after the robot is already less than 20 cm from its target.
      required_movement_radius: 0.05
      movement_time_allowance: 30.0
    # Goal checker parameters
    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.10
      yaw_goal_tolerance: 0.15
      # Recheck position during final rotation; drifting out must not succeed.
      stateful: False
    # DWB parameters
    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: False
      min_vel_x: 0.0
      min_vel_y: 0.0
      # Delivery mode: favor stable tracking over transit speed.
      max_vel_x: 0.18
      max_vel_y: 0.0
      max_vel_theta: 0.6
      min_speed_xy: 0.0
      max_speed_xy: 0.18
      min_speed_theta: 0.0
      # Add high threshold velocity for turtlebot 3 issue.
      # https://github.com/ROBOTIS-GIT/turtlebot3_simulations/issues/75
      acc_lim_x: 1.0
      acc_lim_y: 0.0
      acc_lim_theta: 1.5
      decel_lim_x: -1.0
      decel_lim_y: 0.0
      decel_lim_theta: -1.5
      vx_samples: 20
      # Differential drive has no lateral velocity; duplicate vy=0 samples
      # only consume CPU and increase action-response latency.
      vy_samples: 1
      vtheta_samples: 24
      sim_time: 2.0
      linear_granularity: 0.025
      angular_granularity: 0.0125
      # Reduce transient TF timing jitter failures (e.g. "Transform data too old").
      transform_tolerance: 0.6
      xy_goal_tolerance: 0.10
      trans_stopped_velocity: 0.05
      short_circuit_trajectory_evaluation: True
      stateful: True
      critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "ObstacleFootprint", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
      # Keep lethal/inscribed cells invalid, but do not let the soft inflation
      # cost outweigh goal distance when the valid goal is near a wall.
      BaseObstacle.scale: 0.005
      # Check the full oriented shell/camera footprint at every trajectory pose;
      # center-cell checking alone is insufficient for a non-circular robot.
      ObstacleFootprint.scale: 0.005
      PathAlign.scale: 32.0
      PathAlign.forward_point_distance: 0.05
      GoalAlign.scale: 24.0
      # The projected alignment point must lie inside the arrival window,
      # otherwise it can favor stopping just outside the 10 cm goal radius.
      GoalAlign.forward_point_distance: 0.05
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0

controller_server_rclcpp_node:
  ros__parameters:
    use_sim_time: True

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: "@@ROBOT@@/odom"
      robot_base_frame: "@@ROBOT@@/base_footprint"
      use_sim_time: True
      rolling_window: true
      # Include the complete waiting-point -> elevator-inside segment.
      width: 4
      height: 4
      resolution: 0.05
      transform_tolerance: 0.6
      # OP1 shell is 0.42 x 0.32 m; the front lidar reaches x=0.26 m.
      # A 0.28 m circle incorrectly closes the 0.55 m elevator doorway.
      footprint: "[[0.26, 0.16], [0.26, -0.16], [-0.21, -0.16], [-0.21, 0.16]]"
      footprint_padding: 0.01
      track_unknown_space: @@LOCAL_TRACK_UNKNOWN_SPACE@@
      # The front-mounted 180 degree lidar cannot observe the rear footprint.
      # Seed known space from the current map rather than rejecting every turn
      # into unobserved rear cells. Unknown map cells and live obstacles remain.
      map_topic: "@@OCC_GRID_TOPIC@@"
      plugins: ["static_layer", "voxel_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_topic: "@@OCC_GRID_TOPIC@@"
        map_subscribe_transient_local: @@MAP_SUBSCRIBE_TRANSIENT_LOCAL@@
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.55
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        publish_voxel_map: True
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 2.0
        mark_threshold: 0
        observation_sources: scan
        scan:
          topic: /@@ROBOT@@/scan_2d
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
      always_send_full_costmap: True
  local_costmap_client:
    ros__parameters:
      use_sim_time: True
  local_costmap_rclcpp_node:
    ros__parameters:
      use_sim_time: True

global_costmap:
  global_costmap:
    ros__parameters:
      # StaticLayer reads global `map_topic` if `static_layer.map_topic` is empty (see Foxy static_layer.cpp).
      map_topic: "@@OCC_GRID_TOPIC@@"
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: "@@ROBOT@@/base_footprint"
      use_sim_time: True
      # Match local collision geometry; retain a 1 cm margin on all sides.
      footprint: "[[0.26, 0.16], [0.26, -0.16], [-0.21, -0.16], [-0.21, 0.16]]"
      footprint_padding: 0.01
      resolution: 0.05
      transform_tolerance: 0.6
      rolling_window: @@GLOBAL_ROLLING_WINDOW@@
      width: @@GLOBAL_WINDOW_WIDTH@@
      height: @@GLOBAL_WINDOW_HEIGHT@@
      track_unknown_space: @@TRACK_UNKNOWN_SPACE@@
      unknown_cost_value: @@UNKNOWN_COST_VALUE@@
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /@@ROBOT@@/scan_2d
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_topic: "@@OCC_GRID_TOPIC@@"
        map_subscribe_transient_local: @@MAP_SUBSCRIBE_TRANSIENT_LOCAL@@
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.55
      always_send_full_costmap: True
  global_costmap_client:
    ros__parameters:
      use_sim_time: True
  global_costmap_rclcpp_node:
    ros__parameters:
      use_sim_time: True

planner_server:
  ros__parameters:
    # Avoid needless high-rate replanning that makes the commanded path jitter.
    expected_planner_frequency: 5.0
    use_sim_time: True
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      # An unreachable requested goal must fail, not stop at a substitute point.
      tolerance: 0.0
      use_astar: false
      allow_unknown: @@ALLOW_UNKNOWN@@

planner_server_rclcpp_node:
  ros__parameters:
    use_sim_time: True

recoveries_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    recovery_plugins: ["spin", "back_up", "wait"]
    spin:
      plugin: "nav2_recoveries/Spin"
    back_up:
      plugin: "nav2_recoveries/BackUp"
    wait:
      plugin: "nav2_recoveries/Wait"
    global_frame: "@@ROBOT@@/odom"
    robot_base_frame: "@@ROBOT@@/base_footprint"
    transform_tolerance: 0.6
    use_sim_time: true
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.6
    min_rotational_vel: 0.2
    rotational_acc_lim: 1.5
