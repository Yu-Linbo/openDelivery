# Isolated OpenClaw agent settings; installed alongside the existing trust configuration.
# Target GPT-6.1 Sol is pending account access; use the verified model for now.
model = "gpt-5.6-sol"
model_reasoning_effort = "low"
model_auto_compact_token_limit = 24000
tool_output_token_limit = 1200

